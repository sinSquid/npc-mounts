; NPCMounts 0.4.0 - UTF-8
; Menu Framework 页面：NPC坐骑 / 骑乘配置
; Pending source change: shared INI/menu steps; not deployed until rebuilt.
; NPCScale, SpeedMultiplier and all Seconds: step 0.05
; JumpHeightMultiplier: step 0.1; SeatHeight/Forward/Side: step 0.5
; HeadingDegrees: step 1; RunThreshold/SprintThreshold: step 5
; Out-of-grid values snap to the nearest step when read/applied/saved.
[Mounts]
OverrideNPCScale=0
NPCScale=1.0
SpeedMultiplier=1.0
; 按住时间必须严格超过该值，最小 0.25 秒
DismountHoldSeconds=0.25
DismountAnimationSeconds=0.85
MountAnimationSeconds=0.85
; 0 使用当前游戏交互键；其他值为键盘扫描码（十进制）
DismountKey=0
SeatHeight=12.0
SeatForward=0.0
SeatSide=0.0
HeadingDegrees=0.0
RunThreshold=180.0
SprintThreshold=450.0
AllowJump=1
; 跳跃高度系数 0.8~2.0，步长 0.1
JumpHeightMultiplier=1.0
AllowBackward=0
BlockSneak=1
BlockAlt=1
BlockCombat=1
DebugLog=0
